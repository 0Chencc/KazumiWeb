name: kazumi_web
description: Standalone Kazumi web server — browse & watch anime from any LAN browser, powered by the Kazumi rule ecosystem.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  # Rule engine + HTTP (versions mirror upstream Kazumi's lockfile)
  dio: 5.9.2
  connectivity_plus: ^6.1.5
  cookie_jar: ^4.0.9
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0
  html: any
  crypto: ^3.0.6
  # Read-only import of desktop Kazumi's Hive data (collections / history)
  hive_ce: ^2.16.0
  # WebView-based video source resolution
  # Windows: WebView2; Linux: webkitgtk window; macOS: WKWebView (headless)
  webview_windows:
    git:
      url: https://github.com/Predidit/flutter-webview-windows.git
  desktop_webview_window:
    git:
      url: https://github.com/Predidit/linux_webview_window.git
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_macos: ^1.1.2
  # Logging & data dir
  logger: ^2.6.2
  path_provider: ^2.1.5
  path: any
  synchronized: any
  window_manager: ^0.5.0
  # Status window UI
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  # Tray + autostart
  tray_manager: ^0.5.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/tray_icon.ico
